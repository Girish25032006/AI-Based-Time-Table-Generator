<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | AI Timetable Generator</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->

    <div class="sidebar">

        <div class="logo">
            <h3>AI Timetable</h3>
        </div>

        <ul class="nav flex-column">

            <li class="nav-item">
                <a href="#" class="nav-link active">
                    <i class="bi bi-speedometer2"></i>
                    Dashboard
                </a>
            </li>

            <li class="nav-item">
                <a href="department.html" class="nav-link">
                    <i class="bi bi-building"></i>
                    Department
                </a>
            </li>

            <li class="nav-item">
                <a href="scheme.html" class="nav-link">
                    <i class="bi bi-journal-bookmark"></i>
                    Scheme
                </a>
            </li>

            <li class="nav-item">
                <a href="subject.html" class="nav-link">
                  <i class="bi bi-book"></i>
                  Subject
                </a>
            </li>

            <li class="nav-item">
                <a href="faculty.html" class="nav-link">
                    <i class="bi bi-person-workspace"></i>
                    Faculty
                </a>
            </li>
            <li class="nav-item">
                <a href="faculty-subject-assignment.html" class="nav-link">
                    <i class="bi bi-diagram-3"></i>
                    Faculty Subject Assignment
                </a>
            </li>

            <li class="nav-item">
                <a href="generate-timetable.html" class="nav-link">
                    <i class="bi bi-calendar-week"></i>
                    Generate Timetable
                </a>
            </li>

            <li class="nav-item">
                <a href="view-timetable.html" class="nav-link">
                    <i class="bi bi-table"></i>
                    View Timetable
                </a>
            </li>

            <li class="nav-item mt-auto">
                <a href="index.html" class="nav-link text-danger">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </a>
            </li>

        </ul>

    </div>

    <!-- Main Content -->

    <div class="main-content">

        <!-- Navbar -->

        <nav class="navbar navbar-light bg-white shadow-sm rounded mb-4 px-4">

            <h4 class="mb-0">
                Dashboard
            </h4>

            <div>
                <i class="bi bi-person-circle fs-4"></i>
                <span class="ms-2 fw-bold">
                    Admin
                </span>
            </div>

        </nav>

        <!-- Cards -->

        <div class="row g-4">

            <div class="col-md-4">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <h6>Departments</h6>
                        <h2>6</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <h6>Schemes</h6>
                        <h2>2</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <h6>Subjects</h6>
                        <h2>320</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <h6>Faculty</h6>
                        <h2>45</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <h6>Generated Timetables</h6>
                        <h2>8</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <h6>Pending</h6>
                        <h2>0</h2>
                    </div>
                </div>
            </div>

        </div>

        <!-- Quick Actions -->

        <div class="mt-5">

            <h4 class="mb-3">
                Quick Actions
            </h4>

            <button class="btn btn-primary me-2">
                Add Department
            </button>

            <button class="btn btn-success me-2">
                Add Faculty
            </button>

            <button class="btn btn-warning me-2">
                Add Subject
            </button>

            <button class="btn btn-danger">
                Generate Timetable
            </button>

        </div>

    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
