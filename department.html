<b class="ms-2">Admin</b>

</div>

<div class="card shadow-sm">

<div class="card-body">

<div class="department-toolbar">

    <input
        type="text"
        class="form-control"
        id="searchDepartment"
        placeholder="Search Department">

    <button
        id="updateDepartment"
        class="department-action-btn">
        <i class="bi bi-pencil-square"></i>
        Update
    </button>

    <button
        class="department-action-btn btn-add-department"
        data-bs-toggle="modal"
        data-bs-target="#departmentModal">

        <i class="bi bi-plus-circle"></i>
        Add Department

    </button>

</div>
<div id="departmentTableBody" class="department-grid"></div>

</div>

</div>

</div>

</div>

<!-- Modal -->

<div class="modal fade" id="departmentModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>Add Department</h5>

<button class="btn-close" data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">



<div class="mb-3">

    <label>Department Code</label>

    <input
        type="text"
        id="departmentCode"
        class="form-control"
        placeholder="AIML">

</div>

<div class="mb-3">

    <label>Department Name</label>

    <input
        type="text"
        id="departmentName"
        class="form-control"
        placeholder="Artificial Intelligence & Machine Learning">

</div>

</div>

<div class="modal-footer">

<button class="btn btn-secondary"
data-bs-dismiss="modal">

Cancel

</button>

<button class="btn btn-primary" id="saveDepartment">

Save

</button>

</div>

</div>

</div>
