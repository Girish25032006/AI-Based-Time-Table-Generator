<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generate Timetable</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->

    <div class="sidebar">

        <div class="logo">
            <h3>AI Timetable</h3>
        </div>

        <ul class="nav flex-column">

            <li class="nav-item">
                <a href="dashboard.html" class="nav-link">
                    <i class="bi bi-speedometer2"></i>
                    Dashboard
                </a>
            </li>

            <li class="nav-item">
                <a href="department.html" class="nav-link">
                    <i class="bi bi-building"></i>
                    Department
                </a>
            </li>

            <li class="nav-item">
                <a href="scheme.html" class="nav-link">
                    <i class="bi bi-journal-bookmark"></i>
                    Scheme
                </a>
            </li>

            <li class="nav-item">
                <a href="subject.html" class="nav-link">
                    <i class="bi bi-book"></i>
                    Subject
                </a>
            </li>

            <li class="nav-item">
                <a href="faculty.html" class="nav-link">
                    <i class="bi bi-person-workspace"></i>
                    Faculty
                </a>
            </li>

            <li class="nav-item">
                <a href="generate-timetable.html" class="nav-link active">
                    <i class="bi bi-calendar-week"></i>
                    Generate Timetable
                </a>
            </li>

            <li class="nav-item">
                <a href="view-timetable.html" class="nav-link">
                    <i class="bi bi-table"></i>
                    View Timetable
                </a>
            </li>

            <li class="nav-item">
                <a href="index.html" class="nav-link text-danger">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </a>
            </li>

        </ul>

    </div>

    <!-- Main Content -->

    <div class="main-content">

        <nav class="navbar bg-white shadow-sm rounded px-4 mb-4">

            <h4>Generate Timetable</h4>

            <div>

                <i class="bi bi-person-circle fs-4"></i>

                <b class="ms-2">Admin</b>

            </div>

        </nav>

        <!-- Generate Form -->

        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">

                <h5 class="mb-0">
                    Generate Timetable
                </h5>

            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Department
                        </label>

                        <select class="form-select">

                            <option>Select Department</option>
                            <option>AIML</option>
                            <option>CSE</option>
                            <option>ISE</option>
                            <option>ECE</option>
                            <option>EEE</option>
                            <option>ME</option>
                            <option>CE</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Scheme
                        </label>

                        <select class="form-select">

                            <option>Select Scheme</option>
                            <option>2022</option>
                            <option>2025</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Academic Year
                        </label>

                        <select class="form-select">

                            <option>2026-27</option>
                            <option>2027-28</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Semester Type
                        </label>

                        <select class="form-select">

                            <option>Select Type</option>
                            <option>Odd</option>
                            <option>Even</option>

                        </select>

                    </div>
                                        <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Semester
                        </label>

                        <select class="form-select">

                            <option>Select Semester</option>
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>4</option>
                            <option>5</option>
                            <option>6</option>
                            <option>7</option>
                            <option>8</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Number of Working Days
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            placeholder="6">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Periods Per Day
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            placeholder="8">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Generation Mode
                        </label>

                        <select class="form-select">

                            <option>Automatic</option>
                            <option>Manual</option>

                        </select>

                    </div>

                </div>

                <hr>

                <div class="d-flex gap-3">

                    <button class="btn btn-success">

                        <i class="bi bi-magic"></i>

                        Generate Timetable

                    </button>

                    <button class="btn btn-secondary">

                        <i class="bi bi-arrow-clockwise"></i>

                        Reset

                    </button>

                </div>

                <div class="alert alert-info mt-4">

                    <h6 class="mb-2">
                        Status
                    </h6>

                    Ready to generate timetable.

                </div>

            </div>

        </div>
            </div>

</div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
