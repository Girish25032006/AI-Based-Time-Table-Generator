<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Timetable Generator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container-fluid vh-100">
    <div class="row h-100">

        <!-- Left Side -->
        <div class="col-lg-7 d-none d-lg-flex left-panel">
            <div class="text-center text-white">
                <h1 class="display-4 fw-bold">
                    AI Based Automatic Timetable Generation System
                </h1>

                <p class="lead mt-4">
                    Generate conflict-free timetables efficiently using intelligent scheduling.
                </p>
            </div>
        </div>

        <!-- Right Side -->
        <div class="col-lg-5 d-flex align-items-center justify-content-center">

            <div class="login-card">

                <div class="text-center mb-4">

                    <img src="images/logo.jpg"
                         width="90"
                         alt="Logo">

                    <h3 class="mt-3 fw-bold">
                        Admin Login
                    </h3>

                    <p class="text-muted">
                        Sign in to continue
                    </p>

                </div>

                <form id="loginForm">

                    <div class="mb-3">
                        <label class="form-label">Username</label>

                        <input
                                type="text"
                                class="form-control"
                                placeholder="Enter Username"
                                required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Password</label>

                        <input
                                type="password"
                                class="form-control"
                                placeholder="Enter Password"
                                required>
                    </div>

                    <button
                            type="submit"
                            class="btn btn-primary w-100">

                        Login

                    </button>

                </form>

            </div>

        </div>

    </div>
</div>

<script src="js/script.js"></script>

</body>
</html>
