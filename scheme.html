<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scheme Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->

    <div class="sidebar">

        <div class="logo">
            <h3>AI Timetable</h3>
        </div>

        <ul class="nav flex-column">

            <li class="nav-item">
                <a href="dashboard.html" class="nav-link">
                    <i class="bi bi-speedometer2"></i>
                    Dashboard
                </a>
            </li>

            <li class="nav-item">
                <a href="department.html" class="nav-link">
                    <i class="bi bi-building"></i>
                    Department
                </a>
            </li>

            <li class="nav-item">
                <a href="scheme.html" class="nav-link active">
                    <i class="bi bi-journal-bookmark"></i>
                    Scheme
                </a>
            </li>

            <li class="nav-item">
                <a href="subject.html" class="nav-link">
                    <i class="bi bi-book"></i>
                    Subject
                </a>
            </li>

            <li class="nav-item">
                <a href="faculty.html" class="nav-link">
                    <i class="bi bi-person-workspace"></i>
                    Faculty
                </a>
            </li>

            <li class="nav-item">
                <a href="faculty-subject-assignment.html" class="nav-link">
                    <i class="bi bi-diagram-3"></i>
                    Faculty Subject Assignment
                </a>
            </li>
            <li class="nav-item">
                <a href="timetable-constraints.html" class="nav-link">
                    <i class="bi bi-sliders"></i>
                    Timetable Constraints
                </a>
            </li>

            <li class="nav-item">
                <a href="generate-timetable.html" class="nav-link">
                    <i class="bi bi-calendar-week"></i>
                    Generate Timetable
                </a>
            </li>

            <li class="nav-item">
                <a href="view-timetable.html" class="nav-link">
                    <i class="bi bi-table"></i>
                    View Timetable
                </a>
            </li>

            <li class="nav-item">
                <a href="index.html" class="nav-link text-danger">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </a>
            </li>

        </ul>

    </div>

    <!-- Main Content -->

    <div class="main-content">

        <nav class="navbar bg-white shadow-sm rounded px-4 mb-4">

            <h4>Scheme Management</h4>

            <div>

                <i class="bi bi-person-circle fs-4"></i>

                <b class="ms-2">Admin</b>

            </div>

        </nav>

        <div class="card shadow-sm">

            <div class="card-body">

                <div class="d-flex justify-content-between mb-3">

                    <input
                        type="text"
                        id="searchScheme"
                        class="form-control w-50"
                        placeholder="Search Scheme">

                    <button
                        class="btn btn-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#schemeModal">

                        <i class="bi bi-plus-circle"></i>

                        Add Scheme

                    </button>

                </div>

                <table class="table table-hover table-bordered">

                    <thead class="table-primary">

                        <tr>

                            <th>ID</th>
                            <th>Scheme</th>
                            
                            <th width="150">Action</th>

                        </tr>

                    </thead>

                    <tbody id="schemeTableBody">

                        
                    </tbody>

                </table>
                        </div>
    </div>

    <!-- Add Scheme Modal -->

    <div class="modal fade" id="schemeModal">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">Add Scheme</h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    

                    <div class="mb-3">

                        <label class="form-label">
                            Scheme 
                        </label>

                        <input
                            type="text"
                            id="schemeName"
                            class="form-control"
                            placeholder="Example:2022 Scheme">

                    </div>

                </div>

                <div class="modal-footer">

                    <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancel

                    </button>

                    <button
                        class="btn btn-primary" id="saveScheme">
                        
                        Save Scheme

                    </button>

                </div>

            </div>

        </div>

    </div>
        </div>

</div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/scheme.js"></script>
</body>

</html>
